<body>
<a class="skip-link" href="#main">跳到正文</a>
<main class="shell" id="main">
  <div class="appbar">
    <span class="traffic" aria-hidden="true"><i class="r"></i><i class="y"></i><i class="g"></i></span>
    <span class="appbar-title">CallMeHFK — ~/404.html</span>
    <a class="appbar-link" href="projects/">项目展厅 →</a>
    <span class="appbar-meta">zh-CN</span>
  </div>

  <div class="screen">
    <h1 class="nf-code">HTTP <span class="nf-status">404</span><span class="caret" aria-hidden="true"></span></h1>
    <p class="nf-sub">没有匹配到这个路径。文件可能改名了，也可能从来没有人写过。</p>

    <div class="terminal">
      <div class="terminal-bar">
        <i class="r"></i><i class="y"></i><i class="g"></i>
        <span>CallMeHFK:~$ ls ./该路径</span>
      </div>
      <div class="rules">
        <div class="rule"><span class="num">[x]</span><span class="rname">no such file</span><span class="rtext">请求的路径不在仓库的静态文件里</span></div>
        <div class="rule"><span class="num">[i]</span><span class="rname">site map</span><span class="rtext">根目录只有 index.html、404.html 与 projects/</span></div>
        <div class="rule"><span class="num">[&gt;]</span><span class="rname">recover</span><span class="rtext">从下面两个入口任选一个继续</span></div>
      </div>
    </div>

    <nav class="nf-links" aria-label="恢复导航">
      <a class="nf-link primary" href="index.html">← 返回首页</a>
      <a class="nf-link" href="projects/">进入项目展厅</a>
      <a class="nf-link" href="https://github.com/CallMeHFK" target="_blank" rel="noopener">GitHub ↗</a>
    </nav>

    <p class="nf-exit">CallMeHFK:~$ exit<span class="caret" aria-hidden="true"></span></p>
  </div>

  <div class="statusbar" aria-hidden="true">
    <span><span class="ok">●</span> ready</span>
    <span>utf-8 · dark · #e06a2d</span>
  </div>
</main>
