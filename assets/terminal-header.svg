<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-label="whoami: CallMeHFK">
  <defs>
    <pattern id="scan" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-8%" y="-40%" width="116%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#111821"/>
    </linearGradient>
    <style>
      .cursor { animation: blink 1.15s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .cursor { animation: none; opacity: 1; }
      }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="194" rx="7" fill="#0b0f14" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="758" height="38" rx="7" fill="url(#titlebar)"/>
  <rect x="1" y="32" width="758" height="8" fill="#111821"/>
  <circle cx="22" cy="20" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="5.5" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="5.5" fill="#27c93f"/>
  <text x="380" y="24" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">CallMeHFK: ~</text>
  <line x1="1" y1="40" x2="759" y2="40" stroke="#30363d" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
    <text x="24" y="68" fill="#3fb950">CallMeHFK:~$</text>
    <text x="158" y="68" fill="#c9d1d9">whoami</text>
    <text x="24" y="92" fill="#3fb950">CallMeHFK — 技术与业务交界处的系统思考者</text>
    <text x="24" y="120" fill="#3fb950">CallMeHFK:~$</text>
    <text x="158" y="120" fill="#c9d1d9">./soul</text>
    <text x="24" y="144" fill="#e06a2d" filter="url(#glow)">14 mental models · 14 hard red lines · 0 寒暄 · 100% 结论先行</text>
    <text x="24" y="172" fill="#3fb950">CallMeHFK:~$</text>
  </g>
  <rect class="cursor" x="158" y="160" width="8" height="15" rx="1" fill="#e06a2d"/>
  <rect x="1" y="40" width="758" height="155" fill="url(#scan)" pointer-events="none"/>
</svg>
